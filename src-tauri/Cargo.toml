[package]
name = "audiowave-studio"
version = "1.10.0"
description = "AudioWave Studio Desktop Audio Visualizer"
authors = ["CredibleMark <contact@crediblemark.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audiowave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "isomp4", "pcm", "aac", "alac"] }
realfft = "3.4"
image = "0.25"
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
# HarfBuzz shaping for proper Arabic (RTL, joined letter forms).
rustybuzz = "0.20"
base64 = "0.22"
pollster = "0.3"

[profile.dev]
opt-level = 1
# Workaround for the flaky rust-lld "undefined hidden symbol" linker error
# that appears with multiple codegen units when linking the
# staticlib/cdylib/rlib crate into the dev binary (observed on rustc 1.97).
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

