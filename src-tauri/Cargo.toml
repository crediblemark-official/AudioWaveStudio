[package]
name = "audiowave-studio"
version = "1.5.1"
description = "AudioWave Studio Desktop Audio Visualizer"
authors = ["CredibleMark <contact@crediblemark.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audiowave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "isomp4", "pcm", "aac", "alac"] }
realfft = "3.4"
rayon = "1.10"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
base64 = "0.22"
