[package]
name = "audiowave-studio"
version = "1.12.0"
description = "AudioWave Studio Desktop Audio Visualizer"
authors = ["CredibleMark <contact@crediblemark.com>"]
edition = "2021"
license = "MIT"

[package.metadata.deb]
maintainer = "CredibleMark <contact@crediblemark.com>"
copyright = "2026, CredibleMark <contact@crediblemark.com>"
extended-description = "AudioWave Studio - Professional High-Performance Desktop Audio Visualizer"
section = "sound"
priority = "optional"
assets = [
    ["target/release/audiowave-studio", "usr/bin/audiowave-studio", "755"],
    ["README.md", "usr/share/doc/audiowave-studio/README.md", "644"],
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audiowave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
slint-build = "1.17"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "backend-winit-wayland", "renderer-femtovg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "isomp4", "pcm", "aac", "alac"] }
realfft = "3.4"
image = "0.25"
wgpu = "23"
# Lightweight zero-dependency linear algebra for the native 3D engine
# (Camera + Scene3D). Replaces the OpenGL-based `three-d`/`three-d-asset`
# crates, which did not fit the headless wgpu export pipeline (see the
# 3D-engine notes in src/renderers/three_d_engine.rs).
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
# HarfBuzz shaping for proper Arabic (RTL, joined letter forms).
rustybuzz = "0.20"
base64 = "0.22"
pollster = "0.3"
# Direct access to the winit backend's `CustomApplicationHandler`: the ONLY way
# to receive OS-level file drag & drop in Slint 1.17 (the backend's built-in
# event loop silently ignores winit DroppedFile/HoveredFile events — verified
# in i-slint-backend-winit-1.17.1 event_loop.rs). We install a handler that
# intercepts those events and routes them into a Slint callback.
# NOTE: keep the version in lockstep with the `slint` dependency (both 1.17.x)
# so Cargo unifies them onto a single i-slint-core copy.
i-slint-backend-winit = { version = "1.17", features = ["x11", "wayland"] }

[profile.dev]
opt-level = 1
codegen-units = 1

