[package]
name = "audiowave-studio"
version = "1.10.0"
description = "AudioWave Studio Desktop Audio Visualizer"
authors = ["CredibleMark <contact@crediblemark.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audiowave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
slint-build = "1.9"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "backend-winit-wayland", "renderer-femtovg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "isomp4", "pcm", "aac", "alac"] }
realfft = "3.4"
image = "0.25"
wgpu = "23"
three-d = "0.17"
three-d-asset = "0.7"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
# HarfBuzz shaping for proper Arabic (RTL, joined letter forms).
rustybuzz = "0.20"
base64 = "0.22"
pollster = "0.3"
# Headless rendering backend for the `ui_screenshot` example: lets the real
# AppWindow (ui/*.slint) render to a PNG without a display, so visual parity
# and micro-interactions can be verified pixel-accurately (not via mockups).
# Gated behind the optional `ui-screenshot` feature: plain `cargo build` /
# `cargo test` never enable it, so the software-renderer dep tree is only
# compiled when explicitly requested with `--features ui-screenshot`.
# NOTE: keep the version in lockstep with the `slint` dependency (both 1.17.x)
# so Cargo unifies them onto a single i-slint-core copy.
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"], optional = true }
# Direct access to the winit backend's `CustomApplicationHandler`: the ONLY way
# to receive OS-level file drag & drop in Slint 1.17 (the backend's built-in
# event loop silently ignores winit DroppedFile/HoveredFile events — verified
# in i-slint-backend-winit-1.17.1 event_loop.rs). We install a handler that
# intercepts those events and routes them into a Slint callback.
# NOTE: keep the version in lockstep with the `slint` dependency (both 1.17.x)
# so Cargo unifies them onto a single i-slint-core copy (same rule as
# i-slint-backend-testing above).
i-slint-backend-winit = { version = "1.17", features = ["x11", "wayland"] }

[features]
ui-screenshot = ["dep:i-slint-backend-testing"]

[[example]]
name = "ui_screenshot"
required-features = ["ui-screenshot"]

[profile.dev]
opt-level = 1
# Workaround for the flaky rust-lld "undefined hidden symbol" linker error
# that appears with multiple codegen units when linking the
# staticlib/cdylib/rlib crate into the dev binary (observed on rustc 1.97).
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

