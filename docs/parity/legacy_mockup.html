<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legacy Tauri UI Mockup (from source)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #000000;
    --bg-panel: rgba(10, 10, 10, 0.96);
    --bg-card: rgba(255, 215, 0, 0.03);
    --border-color: rgba(255, 215, 0, 0.16);
    --border-glow: rgba(255, 215, 0, 0.45);
    --accent-cyan: #ffd700;
    --accent-pink: #d4af37;
    --accent-gold: #ffd700;
    --text-main: #f8fafc;
    --text-muted: #a3a3a3;
    --text-sub: #737373;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: 'Inter', system-ui, sans-serif; user-select: none; }
  .app-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: #000; }

  /* NAVBAR */
  .navbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; background: #000; border-bottom: 1px solid rgba(255,215,0,0.2); z-index: 50; }
  .navbar-left, .navbar-right { display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(212,175,55,0.15)); color: #ffd700; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .brand-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .brand-tag { font-size: 11px; font-weight: 600; color: #ffd700; margin-left: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e5e5e5; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-primary { background: rgba(255,215,0,0.14); color: #ffd700; border-color: rgba(255,215,0,0.35); }
  .btn-export { background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #000; font-weight: 700; border: none; box-shadow: 0 0 14px rgba(255,215,0,0.4); }
  .btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); }
  .ticker { display: flex; align-items: center; overflow: hidden; white-space: nowrap; flex: 1; max-width: 440px; height: 32px; background: rgba(255,215,0,0.08); border-radius: 8px; padding: 0 10px; margin: 0 16px; font-size: 11px; color: #ffd700; }
  .window-controls { display: flex; gap: 4px; margin-left: 8px; }
  .btn-winctrl { width: 30px; height: 30px; border: none; background: transparent; color: #a3a3a3; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .btn-winctrl-close:hover { background: rgba(255,50,50,0.3); }

  /* MAIN */
  .main-viewport { display: flex; flex: 1; min-height: 0; }
  .canvas-area { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  .canvas-placeholder { width: 80%; height: 80%; border: 1px dashed rgba(255,215,0,0.3); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #737373; gap: 12px; }
  .canvas-placeholder .icon { font-size: 40px; color: rgba(255,215,0,0.4); }

  /* CONTROL PANEL */
  .control-panel { width: 380px; height: 100%; background: rgba(10,10,10,0.96); border-left: 1px solid rgba(255,215,0,0.16); display: flex; flex-direction: column; }
  .panel-tabs { display: flex; border-bottom: 1px solid rgba(255,215,0,0.16); background: rgba(0,0,0,0.3); }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 4px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #a3a3a3; font-size: 11px; font-weight: 500; cursor: pointer; }
  .tab-btn .t-ic { font-size: 15px; }
  .tab-btn.active { color: #ffd700; border-bottom-color: #ffd700; background: rgba(255,215,0,0.05); }
  .panel-content { flex: 1; overflow-y: auto; padding: 16px; }
  .section-title { font-size: 14px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
  .style-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .style-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.16); border-radius: 10px; color: #a3a3a3; font-size: 10px; cursor: pointer; }
  .style-card .ic { font-size: 18px; }
  .style-card.selected { background: rgba(255,215,0,0.1); border-color: #ffd700; color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.2); }
  .control-group { margin: 14px 0; }
  .label-row { font-size: 12px; color: #a3a3a3; margin-bottom: 6px; display: block; }
  .input-range { width: 100%; accent-color: #ffd700; }
  .panel-footer { padding: 10px 16px; border-top: 1px solid rgba(255,215,0,0.12); font-size: 11px; color: #737373; display: flex; align-items: center; justify-content: space-between; }
  .panel-footer a { color: #ffd700; text-decoration: none; font-weight: 500; }

  /* AUDIO BAR */
  .audio-player-bar { height: 64px; background: rgba(10,11,16,0.95); border-top: 1px solid rgba(255,215,0,0.16); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .player-track-info { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .track-details { display: flex; flex-direction: column; }
  .track-title { font-size: 13px; font-weight: 600; color: #f8fafc; }
  .track-artist { font-size: 11px; color: #a3a3a3; }
  .player-center { display: flex; align-items: center; gap: 16px; flex: 1; }
  .btn-play { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ffd700, #d4af37); color: #000; border: none; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(255,215,0,0.4); }
  .btn-control { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #a3a3a3; cursor: pointer; }
  .player-seeker { display: flex; align-items: center; gap: 10px; flex: 1; }
  .time-text { font-size: 11px; color: #a3a3a3; font-variant-numeric: tabular-nums; }
  .seek-slider { flex: 1; accent-color: #ffd700; }
  .player-right { display: flex; align-items: center; gap: 10px; }
  .volume-slider { width: 100px; accent-color: #ffd700; }
</style>
</head>
<body>
<div class="app-layout">
  <header class="navbar">
    <div class="navbar-left">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">AudioWave</span><span class="brand-tag">Studio</span>
      </div>
      <button class="btn btn-primary">⬆ Load Audio</button>
      <button class="btn">🎧 Listen</button>
    </div>
    <div class="ticker">🚀 Powered by CredibleMark — Jasa Pembuatan Software Web, Mobile & Desktop Professional • Visit crediblemark.com •</div>
    <div class="navbar-right">
      <button class="btn btn-icon">⛶</button>
      <button class="btn btn-icon">⤢</button>
      <button class="btn btn-icon">🖥️</button>
      <button class="btn btn-icon">💾</button>
      <button class="btn btn-icon">📂</button>
      <button class="btn btn-export">🎬 Export MP4 Video</button>
      <div class="window-controls"><button class="btn-winctrl">─</button><button class="btn-winctrl">▢</button><button class="btn-winctrl btn-winctrl-close">✕</button></div>
    </div>
  </header>

  <div class="main-viewport">
    <div class="canvas-area">
      <div class="canvas-placeholder">
        <div class="icon">📊</div>
        <div>Canvas Preview (Spectrum Bars)</div>
      </div>
    </div>

    <aside class="control-panel">
      <nav class="panel-tabs">
        <button class="tab-btn active"><span class="t-ic">🎛️</span><span>Style</span></button>
        <button class="tab-btn"><span class="t-ic">🎨</span><span>Colors</span></button>
        <button class="tab-btn"><span class="t-ic">🖼️</span><span>Background</span></button>
        <button class="tab-btn"><span class="t-ic">✍️</span><span>Text</span></button>
        <button class="tab-btn"><span class="t-ic">📺</span><span>Effects</span></button>
        <button class="tab-btn"><span class="t-ic">🎬</span><span>Export</span></button>
      </nav>
      <div class="panel-content">
        <h3 class="section-title">Visualizer Style</h3>
        <div class="style-grid">
          <button class="style-card selected"><span class="ic">📊</span>Spectrum Bars</button>
          <button class="style-card"><span class="ic">⭕</span>Radial Ring</button>
          <button class="style-card"><span class="ic">📻</span>Oscilloscope</button>
          <button class="style-card"><span class="ic">▦</span>Matrix Equalizer</button>
          <button class="style-card"><span class="ic">➖</span>Minimal Wave</button>
          <button class="style-card"><span class="ic">〰️</span>Waveform Fill</button>
          <button class="style-card"><span class="ic">🎯</span>Circular Bars</button>
          <button class="style-card"><span class="ic">📈</span>Smooth Spectrum</button>
          <button class="style-card"><span class="ic">📻</span>Pulse Rings</button>
        </div>
        <div class="control-group">
          <label class="label-row">Bar Count (64)</label>
          <input type="range" class="input-range" min="16" max="128" value="64">
        </div>
        <div class="control-group">
          <label class="label-row">Sensitivity (1.2x)</label>
          <input type="range" class="input-range" min="0.5" max="2.5" value="1.2" step="0.1">
        </div>
        <div class="control-group">
          <label class="label-row">Smoothing (0.80)</label>
          <input type="range" class="input-range" min="0.1" max="0.95" value="0.8" step="0.05">
        </div>
        <div class="control-group">
          <label class="label-row">Bass Pulse Boost (1.5x)</label>
          <input type="range" class="input-range" min="1.0" max="3.0" value="1.5" step="0.1">
        </div>
        <div class="control-group">
          <label class="label-row">Scale (100%)</label>
          <input type="range" class="input-range" min="0.1" max="2.0" value="1.0" step="0.05">
        </div>
      </div>
      <div class="panel-footer">
        <span>AudioWave Studio v1.9.0</span>
        <a href="#">crediblemark.com</a>
      </div>
    </aside>
  </div>

  <footer class="audio-player-bar">
    <div class="player-track-info">
      <span style="color:#a3a3a3;font-size:18px">🎵</span>
      <div class="track-details">
        <span class="track-title">No Song Loaded</span>
        <span class="track-artist">Import an audio file to start</span>
      </div>
    </div>
    <div class="player-center">
      <button class="btn-play">▶</button>
      <button class="btn-control">⏹</button>
      <div class="player-seeker">
        <span class="time-text">00:00</span>
        <input type="range" class="seek-slider" min="0" max="100" value="0">
        <span class="time-text">00:00</span>
      </div>
    </div>
    <div class="player-right">
      <button class="btn-control">🔊</button>
      <input type="range" class="volume-slider" min="0" max="1" value="0.8" step="0.02">
    </div>
  </footer>
</div>
</body>
</html>
