name: Release AudioWave Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: audiowave-studio-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: audiowave-studio-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: audiowave-studio-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: audiowave-studio-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-shm0-dev libssl-dev pkg-config ffmpeg libasound2-dev libfontconfig1-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev imagemagick

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # WINDOWS CODE SIGNING (Optional Authenticode via SignTool)
      # -----------------------------------------------------------------------
      - name: Windows Code Signing
        if: matrix.os == 'windows-latest' && env.WIN_CERT != ''
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = "$env:TEMP\cert.pfx"
          [System.Convert]::FromBase64String("$env:WIN_CERT") | Set-Content -Path $certPath -Encoding Byte
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f $certPath /p "$env:WIN_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "target\${{ matrix.target }}\release\audiowave-studio.exe"
          Remove-Item -Path $certPath -Force

      # -----------------------------------------------------------------------
      # MACOS CODE SIGNING (Optional Apple Codesign)
      # -----------------------------------------------------------------------
      - name: macOS Code Signing Setup
        if: startsWith(matrix.os, 'macos') && env.MAC_CERT != ''
        env:
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MAC_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$MAC_CERT" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$MAC_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      # -----------------------------------------------------------------------
      # LINUX PACKAGING (.tar.gz, .deb, .AppImage)
      # -----------------------------------------------------------------------
      - name: Package Linux (.tar.gz, .deb, .AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p staging_linux
          cp target/${{ matrix.target }}/release/audiowave-studio staging_linux/
          cp README.md staging_linux/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging_linux .

          # Build Debian / Ubuntu .deb package
          cargo install cargo-deb --no-track || true
          cargo deb --target ${{ matrix.target }} --no-build
          cp target/debian/*.deb ./${{ matrix.artifact_name }}.deb 2>/dev/null || cp target/${{ matrix.target }}/debian/*.deb ./${{ matrix.artifact_name }}.deb

          # Build Portable .AppImage package
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/${{ matrix.target }}/release/audiowave-studio AppDir/usr/bin/
          
          cat << 'EOF' > AppDir/audiowave-studio.desktop
          [Desktop Entry]
          Name=AudioWave Studio
          Exec=audiowave-studio
          Icon=audiowave-studio
          Type=Application
          Categories=AudioVideo;Audio;
          Comment=Desktop Audio Visualizer
          EOF
          cp AppDir/audiowave-studio.desktop AppDir/usr/share/applications/

          convert -size 256x256 xc:gold -fill black -draw "circle 128,128 128,40" AppDir/audiowave-studio.png 2>/dev/null || touch AppDir/audiowave-studio.png
          cp AppDir/audiowave-studio.png AppDir/usr/share/icons/hicolor/256x256/apps/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/audiowave-studio" "$@"
          EOF
          chmod +x AppDir/AppRun

          ./appimagetool --appimage-extract-and-run AppDir ${{ matrix.artifact_name }}.AppImage

      # -----------------------------------------------------------------------
      # WINDOWS PACKAGING (.zip, -setup.exe, .msi)
      # -----------------------------------------------------------------------
      - name: Package Windows (.zip, .exe setup, .msi)
        if: matrix.os == 'windows-latest'
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging_win
          Copy-Item target/${{ matrix.target }}/release/audiowave-studio.exe -Destination staging_win/
          if (Test-Path README.md) { Copy-Item README.md -Destination staging_win/ }
          Compress-Archive -Path staging_win/* -DestinationPath ${{ matrix.artifact_name }}.zip

          # Build Inno Setup Executable Installer (.exe setup)
          $issContent = @"
          [Setup]
          AppName=AudioWave Studio
          AppVersion=1.12.0
          AppPublisher=CredibleMark Studio
          DefaultDirName={autopf}\AudioWave Studio
          DefaultGroupName=AudioWave Studio
          UninstallDisplayIcon={app}\audiowave-studio.exe
          Compression=lzma2/ultra64
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=${{ matrix.artifact_name }}-setup

          [Files]
          Source: "target\${{ matrix.target }}\release\audiowave-studio.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "README.md"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist

          [Icons]
          Name: "{autoprograms}\AudioWave Studio"; Filename: "{app}\audiowave-studio.exe"
          Name: "{autodesktop}\AudioWave Studio"; Filename: "{app}\audiowave-studio.exe"
          "@
          Set-Content -Path installer.iss -Value $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

          # Create .msi installer copy for Windows MSI deployment
          Copy-Item ${{ matrix.artifact_name }}-setup.exe ${{ matrix.artifact_name }}.msi

          # Sign Installer Executables if Code Signing Cert is present
          if ("$env:WIN_CERT" -ne "") {
            $certPath = "$env:TEMP\cert.pfx"
            [System.Convert]::FromBase64String("$env:WIN_CERT") | Set-Content -Path $certPath -Encoding Byte
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f $certPath /p "$env:WIN_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "${{ matrix.artifact_name }}-setup.exe"
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f $certPath /p "$env:WIN_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "${{ matrix.artifact_name }}.msi"
            Remove-Item -Path $certPath -Force
          }

      # -----------------------------------------------------------------------
      # MACOS PACKAGING (.tar.gz, .dmg) & SIGNING
      # -----------------------------------------------------------------------
      - name: Package macOS (.tar.gz & .dmg)
        if: startsWith(matrix.os, 'macos')
        env:
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p staging_mac
          cp target/${{ matrix.target }}/release/audiowave-studio staging_mac/
          cp README.md staging_mac/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging_mac .

          # Build macOS App Bundle & .dmg Disk Image
          mkdir -p "AudioWave Studio.app/Contents/MacOS"
          mkdir -p "AudioWave Studio.app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/audiowave-studio" "AudioWave Studio.app/Contents/MacOS/audiowave-studio"
          chmod +x "AudioWave Studio.app/Contents/MacOS/audiowave-studio"

          cat << 'EOF' > "AudioWave Studio.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>audiowave-studio</string>
              <key>CFBundleIdentifier</key>
              <string>com.crediblemark.audiowavestudio</string>
              <key>CFBundleName</key>
              <string>AudioWave Studio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Sign App Bundle if macOS cert is present
          if [ "$MAC_CERT" != "" ]; then
            codesign --force --deep --options runtime --sign "Developer ID Application: CredibleMark Studio" "AudioWave Studio.app" || true
          fi

          mkdir -p dmg_stage
          cp -r "AudioWave Studio.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "AudioWave Studio" -srcfolder dmg_stage -ov -format UDZO "${{ matrix.artifact_name }}.dmg"

      # -----------------------------------------------------------------------
      # GENERATE SHA-256 CHECKSUMS (BINARY INTEGRITY SIGNATURE)
      # -----------------------------------------------------------------------
      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          sha256sum ${{ matrix.artifact_name }}* > ${{ matrix.artifact_name }}-SHA256SUMS.txt 2>/dev/null || shasum -a 256 ${{ matrix.artifact_name }}* > ${{ matrix.artifact_name }}-SHA256SUMS.txt

      # -----------------------------------------------------------------------
      # PUBLISH ALL SIGNED INSTALLER PACKAGES TO GITHUB RELEASES
      # -----------------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ matrix.artifact_name }}*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
