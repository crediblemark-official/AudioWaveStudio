name: Release AudioWave Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Prepare sidecar ffmpeg binary for macOS
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg || true
          FFMPEG_BIN=$(which ffmpeg || echo "")
          mkdir -p src-tauri/binaries
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          fi

      - name: Prepare sidecar ffmpeg binary for Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          FFMPEG_BIN=$(which ffmpeg || echo "")
          mkdir -p src-tauri/binaries
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          fi

      - name: Prepare sidecar ffmpeg binary for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install ffmpeg --no-progress || true
          mkdir -p src-tauri/binaries
          if [ -f "/c/ProgramData/chocolatey/bin/ffmpeg.exe" ]; then
            cp /c/ProgramData/chocolatey/bin/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AudioWave Studio v__VERSION__'
          releaseBody: 'Download AudioWave Studio installers below for Windows, macOS, and Linux.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
