name: CI Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Prepare sidecar ffmpeg binary for macOS
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg || true
          FFMPEG_BIN=$(which ffmpeg || echo "")
          mkdir -p src-tauri/binaries
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          fi

      - name: Prepare sidecar ffmpeg binary for Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          FFMPEG_BIN=$(which ffmpeg || echo "")
          mkdir -p src-tauri/binaries
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          fi

      - name: Prepare sidecar ffmpeg binary for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install ffmpeg --no-progress || true
          mkdir -p src-tauri/binaries
          if [ -f "/c/ProgramData/chocolatey/bin/ffmpeg.exe" ]; then
            cp /c/ProgramData/chocolatey/bin/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Tauri build dry-run
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          action: 'no'
